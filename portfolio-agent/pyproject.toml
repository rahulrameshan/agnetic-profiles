[project]
name = "portfolio-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "bcrypt>=4.2.0",
    "fastapi>=0.135.3",
    "openai>=2.31.0",
    "psycopg[binary]>=3.2.0",
    "pydantic[email]>=2.10.0",
    "pyjwt>=2.10.0",
    "pypdf>=6.10.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.26",
    "requests>=2.33.1",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.44.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "types-requests>=2.33.0.20260712",
]

[tool.mypy]
python_version = "3.12"
files = ["app", "seed.py"]

# Baseline: the codebase passes this cleanly today, so any new error is a real
# regression rather than pre-existing debt. Tighten by adding
# `disallow_untyped_defs` once the annotations are in — module by module via
# [[tool.mypy.overrides]] rather than all at once.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# Generated migrations are Alembic's output, not hand-written code.
exclude = "alembic/versions/"

[[tool.mypy.overrides]]
# No published stubs; both are used behind a thin adapter anyway.
module = ["slowapi.*", "pypdf.*"]
ignore_missing_imports = true
