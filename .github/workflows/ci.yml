name: CI

# Runs on pull requests, and on pushes to main so the badge reflects the
# branch you actually deploy from. Merging a PR produces a push event on main,
# so nothing here requires pushing to main directly.
on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the in-flight run obsolete — cancel it rather than
# paying for a result nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mypy:
    name: mypy (backend)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: portfolio-agent/uv.lock

      - name: Install dependencies
        working-directory: portfolio-agent
        # --frozen fails if uv.lock is out of date with pyproject.toml, so a
        # dependency change without a relocked file is caught here.
        run: uv sync --frozen

      - name: Run mypy
        working-directory: portfolio-agent
        # Config lives in pyproject.toml, including which paths are checked.
        run: uv run mypy

  build:
    name: build images
    # Don't spend runner minutes building images for code that fails type checks.
    needs: mypy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: api
            context: portfolio-agent
            build-args: ""
          - image: web
            context: portfolio-ui
            # REACT_APP_* is baked in at build time. Without this the bundle
            # would point at localhost:8000 instead of the same-origin /api.
            build-args: REACT_APP_AGENT_URL=/api

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build-args }}
          # Pull requests build only — publishing happens on merge to main.
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}-${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
