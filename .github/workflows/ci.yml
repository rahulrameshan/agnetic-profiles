name: CI

# Runs on pull requests, and on pushes to main so the badge reflects the
# branch you actually deploy from.
on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the in-flight run obsolete — cancel it rather than
# paying for a result nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mypy:
    name: mypy (backend)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: portfolio-agent/uv.lock

      - name: Install dependencies
        working-directory: portfolio-agent
        # --frozen fails if uv.lock is out of date with pyproject.toml, so a
        # dependency change without a relocked file is caught here.
        run: uv sync --frozen

      - name: Run mypy
        working-directory: portfolio-agent
        # Config lives in pyproject.toml, including which paths are checked.
        run: uv run mypy
